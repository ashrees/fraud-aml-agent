name: fraud-aml-agent

services:
  # ── Kafka-compatible broker (lighter than Kafka on a laptop) ──────────────
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"   # Kafka API for services running on your host
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Create topics once the broker is healthy
  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rpk -X brokers=redpanda:9092 topic create raw_txns -p 3 -r 1 || true
        rpk -X brokers=redpanda:9092 topic create raw_reference -p 1 -r 1 || true
        rpk -X brokers=redpanda:9092 topic create alerts -p 3 -r 1 || true
        echo "topics ready"
    restart: "no"

  # Web UI to watch topics and messages: http://localhost:8080
  redpanda-console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  # ── S3-compatible object store for the raw landing zone ──────────────────
  # SeaweedFS replaces MinIO, whose images were removed from Docker Hub in
  # September 2026. Apache-2.0, S3-compatible. The image runs `weed mini`
  # (all-in-one single node) by default.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-amladmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-amladmin-secret}
      S3_BUCKET: ${S3_BUCKET:-aml-raw}   # created on first start (idempotent)
    ports:
      - "9000:8333"     # S3 API (host port 9000, so app config stays the same)
      - "8888:8888"     # Filer UI: browse the raw files
      - "23646:23646"   # Admin UI
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ── Postgres: cases, audit log, HITL decisions, LangGraph checkpoints ────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aml}
      POSTGRES_DB: ${POSTGRES_DB:-aml}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/postgres/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aml}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  seaweedfs-data:
  pg-data:
